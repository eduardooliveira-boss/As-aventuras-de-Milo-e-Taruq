<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>As Aventuras de Milo e Taruq</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0914;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* Proporção 16:9 */
      max-height: 100vh;
      max-width: 177.78vh;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="960" height="540"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Estado do Jogo: 'MENU', 'PLAYING', 'WIN', 'GAMEOVER'
let gameState = 'MENU';

// Configurações do Mundo
const GRAVITY = 0.55;
const FLOOR_Y = 440;
const LEVEL_WIDTH = 2800;

// Entrada de Teclas
const keys = { right: false, left: false, up: false };

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
    keys.up = true;
    if (gameState === 'MENU') startGame();
    if (gameState === 'WIN' || gameState === 'GAMEOVER') resetGame();
  }
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.up = false;
});

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
  const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (gameState === 'MENU') {
    // Botão Iniciar Jogo (x: 380, y: 230, w: 200, h: 50)
    if (clickX >= 380 && clickX <= 580 && clickY >= 230 && clickY <= 280) {
      startGame();
    }
  } else if (gameState === 'WIN' || gameState === 'GAMEOVER') {
    resetGame();
  }
});

// Entidades
const taruq = {
  x: 100,
  y: FLOOR_Y - 70,
  width: 36,
  height: 70,
  vx: 0,
  vy: 0,
  speed: 4,
  jumpPower: -12,
  grounded: false,
  facing: 'right',
  animFrame: 0
};

const milo = {
  x: 60,
  y: FLOOR_Y - 30,
  width: 30,
  height: 26,
  vx: 0,
  vy: 0,
  facing: 'right',
  animFrame: 0
};

const aisha = {
  x: LEVEL_WIDTH - 180,
  y: FLOOR_Y - 72,
  width: 38,
  height: 72
};

// Obstáculos (Caixas, Barris e Picos)
const obstacles = [
  { x: 500, y: FLOOR_Y - 40, w: 40, h: 40, type: 'box' },
  { x: 850, y: FLOOR_Y - 45, w: 45, h: 45, type: 'barrel' },
  { x: 1200, y: FLOOR_Y - 35, w: 60, h: 35, type: 'spikes' },
  { x: 1600, y: FLOOR_Y - 40, w: 40, h: 40, type: 'box' },
  { x: 1950, y: FLOOR_Y - 45, w: 45, h: 45, type: 'barrel' },
  { x: 2300, y: FLOOR_Y - 35, w: 70, h: 35, type: 'spikes' }
];

let cameraX = 0;
let torchAnimation = 0;

function startGame() {
  gameState = 'PLAYING';
}

function resetGame() {
  taruq.x = 100;
  taruq.y = FLOOR_Y - taruq.height;
  taruq.vx = 0;
  taruq.vy = 0;
  milo.x = 60;
  milo.y = FLOOR_Y - milo.height;
  gameState = 'PLAYING';
}

// Loop Principal
function update() {
  torchAnimation += 0.1;

  if (gameState === 'PLAYING') {
    // Movimento do Taruq
    if (keys.right) {
      taruq.vx = taruq.speed;
      taruq.facing = 'right';
    } else if (keys.left) {
      taruq.vx = -taruq.speed;
      taruq.facing = 'left';
    } else {
      taruq.vx = 0;
    }

    if (keys.up && taruq.grounded) {
      taruq.vy = taruq.jumpPower;
      taruq.grounded = false;
    }

    taruq.vy += GRAVITY;
    taruq.x += taruq.vx;
    taruq.y += taruq.vy;

    // Colisão do Taruq com o Chão
    if (taruq.y + taruq.height >= FLOOR_Y) {
      taruq.y = FLOOR_Y - taruq.height;
      taruq.vy = 0;
      taruq.grounded = true;
    }

    // Limites de Tela
    if (taruq.x < 0) taruq.x = 0;
    if (taruq.x + taruq.width > LEVEL_WIDTH) taruq.x = LEVEL_WIDTH - taruq.width;

    // Movimento Suave do Milo (Segue Taruq)
    const targetMiloX = taruq.facing === 'right' ? taruq.x - 45 : taruq.x + 45;
    milo.x += (targetMiloX - milo.x) * 0.1;
    milo.facing = taruq.facing;

    // Milo pula se estiver longe na vertical
    milo.vy += GRAVITY;
    milo.y += milo.vy;
    if (milo.y + milo.height >= FLOOR_Y) {
      milo.y = FLOOR_Y - milo.height;
      milo.vy = 0;
    }
    if (taruq.vy < -4 && milo.y >= FLOOR_Y - milo.height) {
      milo.vy = -9;
    }

    // Animação dos passos
    if (Math.abs(taruq.vx) > 0) taruq.animFrame += 0.15;

    // Câmera Acompanha o Personagem
    cameraX = taruq.x - canvas.width / 3;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > LEVEL_WIDTH - canvas.width) cameraX = LEVEL_WIDTH - canvas.width;

    // Verificação de Colisão com Obstáculos
    for (let obs of obstacles) {
      if (
        taruq.x + 8 < obs.x + obs.w &&
        taruq.x + taruq.width - 8 > obs.x &&
        taruq.y + taruq.height > obs.y + 10
      ) {
        gameState = 'GAMEOVER';
      }
    }

    // Chegada na Aisha (Vitória)
    if (Math.abs(taruq.x - aisha.x) < 40) {
      gameState = 'WIN';
    }
  }
}

// Renderização Pixel Art
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // 1. Fundo (Cenas do Palácio ao Pôr do Sol)
  drawBackground();

  // 2. Obstáculos
  drawObstacles();

  // 3. Personagens
  drawAisha(aisha.x, aisha.y);
  drawTaruq(taruq.x, taruq.y, taruq.facing, taruq.animFrame);
  drawMilo(milo.x, milo.y, milo.facing);

  ctx.restore();

  // 4. Interface (UI / Telas)
  drawUI();
}

function drawBackground() {
  // Céu
  let grad = ctx.createLinearGradient(0, 0, 0, 400);
  grad.addColorStop(0, '#2e1c36');
  grad.addColorStop(1, '#6b3e3e');
  ctx.fillStyle = grad;
  ctx.fillRect(cameraX, 0, canvas.width, canvas.height);

  // Silhuetas de Mesquitas / Torres ao Fundo
  ctx.fillStyle = '#1e1423';
  for (let i = 0; i < LEVEL_WIDTH; i += 400) {
    ctx.fillRect(i + 50, 180, 70, 260);
    ctx.beginPath();
    ctx.arc(i + 85, 180, 35, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(i + 220, 120, 25, 320); // Minarete
    ctx.fillRect(i + 215, 110, 35, 10);
  }

  // Parede do Palácio
  ctx.fillStyle = '#4a3228';
  ctx.fillRect(0, 260, LEVEL_WIDTH, 180);

  // Arcos e Pilares nas Paredes
  ctx.fillStyle = '#3a251e';
  for (let i = 0; i < LEVEL_WIDTH; i += 300) {
    ctx.fillRect(i, 260, 30, 180);
    ctx.fillRect(i + 30, 260, 120, 20);
    // Archway
    ctx.fillRect(i + 40, 280, 100, 160);
  }

  // Tochas na Parede
  for (let i = 150; i < LEVEL_WIDTH; i += 300) {
    ctx.fillStyle = '#22140e';
    ctx.fillRect(i, 320, 10, 30);
    // Fogo Animado
    let flameSize = 8 + Math.sin(torchAnimation * 2 + i) * 3;
    ctx.fillStyle = '#ff9900';
    ctx.beginPath();
    ctx.arc(i + 5, 315, flameSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(i + 5, 315, flameSize * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Chão
  ctx.fillStyle = '#281c18';
  ctx.fillRect(0, FLOOR_Y, LEVEL_WIDTH, 100);
  ctx.fillStyle = '#1c1310';
  ctx.fillRect(0, FLOOR_Y, LEVEL_WIDTH, 6);
}

function drawObstacles() {
  for (let obs of obstacles) {
    if (obs.type === 'box') {
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#5c3a1e';
      ctx.strokeRect(obs.x + 2, obs.y + 2, obs.w - 4, obs.h - 4);
    } else if (obs.type === 'barrel') {
      ctx.fillStyle = '#6e3c1b';
      ctx.beginPath();
      ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 6);
      ctx.fill();
      ctx.fillStyle = '#a8a8a8';
      ctx.fillRect(obs.x, obs.y + 10, obs.w, 4);
      ctx.fillRect(obs.x, obs.y + obs.h - 14, obs.w, 4);
    } else if (obs.type === 'spikes') {
      ctx.fillStyle = '#808080';
      const spikeCount = 4;
      const sw = obs.w / spikeCount;
      for (let s = 0; s < spikeCount; s++) {
        ctx.beginPath();
        ctx.moveTo(obs.x + s * sw, obs.y + obs.h);
        ctx.lineTo(obs.x + s * sw + sw / 2, obs.y);
        ctx.lineTo(obs.x + (s + 1) * sw, obs.y + obs.h);
        ctx.fill();
      }
    }
  }
}

// Desenho do Taruq
function drawTaruq(x, y, facing, frame) {
  ctx.save();
  if (facing === 'left') {
    ctx.translate(x + taruq.width, y);
    ctx.scale(-1, 1);
    x = 0;
    y = 0;
  }

  const step = Math.sin(frame) * 4;

  // Cabelo e Barba
  ctx.fillStyle = '#2a1a10';
  ctx.fillRect(x + 10, y, 16, 14);

  // Rosto
  ctx.fillStyle = '#d49b72';
  ctx.fillRect(x + 12, y + 6, 12, 10);

  // Colete Azul
  ctx.fillStyle = '#2b4566';
  ctx.fillRect(x + 8, y + 18, 20, 26);

  // Camisa Branca (mangas)
  ctx.fillStyle = '#e6e6e6';
  ctx.fillRect(x + 4, y + 20, 5, 16);
  ctx.fillRect(x + 27, y + 20, 5, 16);

  // Cinto
  ctx.fillStyle = '#5a3825';
  ctx.fillRect(x + 8, y + 42, 20, 5);
  ctx.fillStyle = '#d4af37';
  ctx.fillRect(x + 16, y + 42, 4, 5);

  // Calças Escuras
  ctx.fillStyle = '#222930';
  ctx.fillRect(x + 10, y + 47, 7, 15 - step);
  ctx.fillRect(x + 19, y + 47, 7, 15 + step);

  // Botas
  ctx.fillStyle = '#4a2e1b';
  ctx.fillRect(x + 8, y + 60 - step, 9, 10);
  ctx.fillRect(x + 19, y + 60 + step, 9, 10);

  ctx.restore();
}

// Desenho do Gato Milo
function drawMilo(x, y, facing) {
  ctx.save();
  if (facing === 'left') {
    ctx.translate(x + milo.width, y);
    ctx.scale(-1, 1);
    x = 0;
    y = 0;
  }

  // Corpo Laranja
  ctx.fillStyle = '#f29924';
  ctx.fillRect(x + 4, y + 10, 20, 12);

  // Cabeça
  ctx.fillRect(x + 18, y + 4, 10, 10);

  // Orelhas
  ctx.fillStyle = '#d17b11';
  ctx.fillRect(x + 20, y + 1, 3, 3);
  ctx.fillRect(x + 25, y + 1, 3, 3);

  // Olho
  ctx.fillStyle = '#000000';
  ctx.fillRect(x + 24, y + 6, 2, 3);

  // Patas
  ctx.fillStyle = '#d17b11';
  ctx.fillRect(x + 6, y + 22, 4, 4);
  ctx.fillRect(x + 18, y + 22, 4, 4);

  // Cauda Curvada
  ctx.fillStyle = '#f29924';
  ctx.fillRect(x, y + 4, 4, 10);

  ctx.restore();
}

// Desenho da Aisha
function drawAisha(x, y) {
  // Véu / Cabelo
  ctx.fillStyle = '#a32a42';
  ctx.fillRect(x + 6, y, 24, 70);

  // Vestido Bordô Elegante
  ctx.fillStyle = '#6b1d2e';
  ctx.fillRect(x + 8, y + 18, 20, 52);

  // Rosto
  ctx.fillStyle = '#e0a982';
  ctx.fillRect(x + 12, y + 8, 12, 10);

  // Detalhes Dourados / Joias
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(x + 10, y + 6, 16, 3);
  ctx.fillRect(x + 10, y + 24, 16, 20);

  // Etiqueta Nome Aisha
  drawLabel(x - 5, y + 75, "Aisha");
}

function drawLabel(x, y, text) {
  ctx.fillStyle = '#d9c09e';
  ctx.fillRect(x, y, 50, 18);
  ctx.strokeStyle = '#5c4328';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, 50, 18);
  ctx.fillStyle = '#2b1a0e';
  ctx.font = 'bold 10px monospace';
  ctx.fillText(text, x + 8, y + 13);
}

function drawUI() {
  if (gameState === 'MENU') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Caixas com Nomes
    drawLabel(80, 480, "Milo");
    drawLabel(455, 480, "Taruq");
    drawLabel(830, 480, "Aisha");

    // Botão Iniciar Jogo
    ctx.fillStyle = '#d9c09e';
    ctx.fillRect(380, 230, 200, 50);
    ctx.strokeStyle = '#5c4328';
    ctx.lineWidth = 4;
    ctx.strokeRect(380, 230, 200, 50);

    ctx.fillStyle = '#2b1a0e';
    ctx.font = 'bold 20px Georgia';
    ctx.textAlign = 'center';
    ctx.fillText('Iniciar Jogo', 480, 262);

    ctx.fillStyle = '#ffffff';
    ctx.font = '14px monospace';
    ctx.fillText('Controles: Setas ou A/D para andar | Espaço ou W para Pular', 480, 320);

  } else if (gameState === 'WIN') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 36px Georgia';
    ctx.textAlign = 'center';
    ctx.fillText('Você Encontrou a Aisha!', canvas.width / 2, 240);

    ctx.fillStyle = '#ffffff';
    ctx.font = '18px monospace';
    ctx.fillText('Clique ou Pressione Espaço para Jogar Novamente', canvas.width / 2, 300);

  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff4d4d';
    ctx.font = 'bold 36px Georgia';
    ctx.textAlign = 'center';
    ctx.fillText('Ops! Você Atingiu um Obstáculo', canvas.width / 2, 240);

    ctx.fillStyle = '#ffffff';
    ctx.font = '18px monospace';
    ctx.fillText('Pressione Espaço ou Clique para Tentar Novamente', canvas.width / 2, 300);
  }
}

// Loop Principal de Execução
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
