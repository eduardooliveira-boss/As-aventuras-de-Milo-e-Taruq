<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>As Aventuras de Milo e Taruq</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0d0914; }
    #canvas-container {
      position: relative; width: 100vw; height: 56.25vw;
      max-height: 100vh; max-width: 177.78vh;
      margin: auto; top: 50%; transform: translateY(-50%);
    }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>
  <script src="index.js"></script>
</body>
</html>
